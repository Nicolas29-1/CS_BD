<h2>Registrar nuevo producto</h2>

<form #productoForm="ngForm" (ngSubmit)="guardar()">
  <div>
    <label>Categoría (ID)</label>
    <input type="number" name="categoryId" [(ngModel)]="producto.categoryId" required min="1">
  </div>

  <div>
    <label>Colección (ID, opcional)</label>
    <input type="number" name="collectionId" [(ngModel)]="producto.collectionId" min="1">
  </div>

  <div>
    <label>Nombre</label>
    <input type="text" name="name" [(ngModel)]="producto.name" required maxlength="100">
  </div>

  <div>
    <label>Precio</label>
    <input type="number" name="price" [(ngModel)]="producto.price" required min="0" step="0.01">
  </div>

  <div>
    <label>Stock</label>
    <input type="number" name="stock" [(ngModel)]="producto.stock" required min="0" step="1">
  </div>

  <div>
    <label>Creado por</label>
    <input type="text" name="createdBy" [(ngModel)]="producto.createdBy" required maxlength="50">
  </div>

  <div>
    <label>URL de imagen (opcional)</label>
    <input type="text" name="imageUrl" [(ngModel)]="producto.imageUrl" maxlength="255">
  </div>

  <button type="button" (click)="limpiar()">Limpiar</button>
  <button type="submit" [disabled]="productoForm.invalid">Guardar producto</button>
</form>

@if (mensaje()) { <p style="color: green">{{ mensaje() }}</p> }
@if (error()) { <p style="color: red">{{ error() }}</p> }
